<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Gastos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <h1>Control de gastos</h1>
    <section class="resumen" aria-label="Resumen financiero">
      <div class="resumen__item resumen__item--balance">
        <span class="resumen__label">Balance</span>
        <strong id="resumen-balance">$0.00</strong>
      </div>
      <div class="resumen__item">
        <span class="resumen__label">Ingresos</span>
        <strong id="resumen-ingresos" class="es-ingreso">$0.00</strong>
      </div>
      <div class="resumen__item">
        <span class="resumen__label">Gastos</span>
        <strong id="resumen-gastos" class="es-gasto">$0.00</strong>
      </div>
    </section>
  </header>

  <main class="layout">
    <section class="panel panel--form" aria-labelledby="form-titulo">
      <h2 id="form-titulo">Nuevo movimiento</h2>
      <form id="form-movimiento" novalidate>
        <fieldset class="tipo">
          <legend>Tipo</legend>
          <label class="tipo__op"><input type="radio" name="tipo" value="gasto" checked /><span>Gasto</span></label>
          <label class="tipo__op"><input type="radio" name="tipo" value="ingreso" /><span>Ingreso</span></label>
        </fieldset>

        <div class="campo">
          <label for="monto">Monto (USD)</label>
          <input id="monto" name="monto" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" />
          <small class="error" data-error="monto"></small>
        </div>

        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria"></select>
          <small class="error" data-error="categoria"></small>
        </div>

        <div class="campo">
          <label for="descripcion">Descripción <span class="opcional">(opcional)</span></label>
          <input id="descripcion" name="descripcion" type="text" maxlength="80" placeholder="Ej. Supermercado" />
          <small class="error" data-error="descripcion"></small>
        </div>

        <div class="campo">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" />
          <small class="error" data-error="fecha"></small>
        </div>

        <div class="acciones">
          <button type="submit" id="btn-guardar" class="btn btn--primario">Agregar movimiento</button>
          <button type="button" id="btn-cancelar" class="btn btn--texto" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="panel panel--lista" aria-labelledby="lista-titulo">
      <div class="lista__cabecera">
        <h2 id="lista-titulo">Movimientos <span id="contador" class="contador"></span></h2>
      </div>

      <div class="filtros">
        <input id="filtro-busqueda" type="search" placeholder="Buscar por descripción o categoría" aria-label="Buscar movimientos" />
        <select id="filtro-tipo" aria-label="Filtrar por tipo">
          <option value="todos">Todos los tipos</option>
          <option value="ingreso">Ingresos</option>
          <option value="gasto">Gastos</option>
        </select>
        <select id="filtro-categoria" aria-label="Filtrar por categoría"></select>
      </div>

      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Detalle</th><th>Categoría</th>
              <th class="num">Monto</th><th><span class="sr-only">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="lista-movimientos"></tbody>
        </table>
      </div>
      <p id="vacio" class="vacio" hidden></p>
    </section>
  </main>

  <dialog id="dlg-confirmar" aria-labelledby="dlg-titulo">
    <form method="dialog">
      <h3 id="dlg-titulo">Eliminar movimiento</h3>
      <p id="dlg-mensaje"></p>
      <div class="acciones acciones--derecha">
        <button value="cancelar" class="btn btn--texto">Cancelar</button>
        <button value="ok" class="btn btn--peligro">Eliminar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
